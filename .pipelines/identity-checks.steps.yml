# Only the maintained ShiftTemplates framework pipeline includes these gates.
parameters:
- name: identityRoot
  type: string
  default: $(Build.SourcesDirectory)/../ShiftIdentity
- name: templatesRoot
  type: string
  default: $(Build.SourcesDirectory)
steps:
- task: UseDotNet@2
  inputs:
    packageType: sdk
    version: '10.0.x'
- pwsh: 'dotnet build "${{ parameters.templatesRoot }}/content/Framework Project/StockPlusPlus.API/StockPlusPlus.API.csproj" --configuration Debug -p:IdentityAdmissionPreview=true'
  displayName: Build opt-in StockPlusPlus admission preview
- pwsh: '& "${{ parameters.identityRoot }}/eng/Start-IdentitySql.ps1"'
  displayName: Start owned identity SQL fixture
# Policy tests need no database. Http is only ever applied together with Sql, so filtering on it here ran those
# 206 SQL-backed tests a second time; the identity-sql gate below runs every Sql test exactly once.
- pwsh: '& "${{ parameters.identityRoot }}/eng/Test-IdentitySuite.ps1" -Project "${{ parameters.identityRoot }}/ShiftIdentity.Tests/ShiftIdentity.Tests.csproj" -Filter "Category=Policy" -Suite identity-policy -ResultsRoot "$(Agent.TempDirectory)/identity-results"'
  displayName: identity-policy
- pwsh: '& "${{ parameters.identityRoot }}/eng/Test-IdentitySuite.ps1" -Project "${{ parameters.identityRoot }}/ShiftIdentity.Tests/ShiftIdentity.Tests.csproj" -Filter "Category=Sql" -Suite identity-sql -ResultsRoot "$(Agent.TempDirectory)/identity-results"'
  displayName: identity-sql
  env:
    SHIFT_IDENTITY_TEST_SQL: $(IdentitySqlConnection)
# Real-clock timing evidence: the production response floors, tens of seconds of deliberate waiting. Off by default;
# a tag whose name contains "with-long-running-tests" (release-framework-with-long-running-tests, for example) runs it.
- pwsh: '& "${{ parameters.identityRoot }}/eng/Test-IdentitySuite.ps1" -Project "${{ parameters.identityRoot }}/ShiftIdentity.Tests/ShiftIdentity.Tests.csproj" -Filter "Category=LongRunning" -Suite identity-long-running -ResultsRoot "$(Agent.TempDirectory)/identity-results"'
  displayName: identity-long-running
  condition: and(succeeded(), contains(variables['Build.SourceBranch'], 'with-long-running-tests'))
  env:
    SHIFT_IDENTITY_LONG_RUNNING: '1'
    SHIFT_IDENTITY_TEST_SQL: $(IdentitySqlConnection)
- pwsh: '& "${{ parameters.identityRoot }}/eng/Test-IdentitySuite.ps1" -Project "${{ parameters.identityRoot }}/ShiftIdentity.Blazor.Tests/ShiftIdentity.Blazor.Tests.csproj" -Filter "Category=Ui" -Suite identity-ui -ResultsRoot "$(Agent.TempDirectory)/identity-results"'
  displayName: identity-ui
- pwsh: '& "${{ parameters.identityRoot }}/eng/Test-IdentitySuite.ps1" -Project "${{ parameters.templatesRoot }}/content/Framework Project/StockPlusPlus.Test/StockPlusPlus.Test.csproj" -Filter "Category=IdentityConsumer" -Suite identity-consumer-contract -ResultsRoot "$(Agent.TempDirectory)/identity-results"'
  displayName: identity-consumer-contract
  env:
    SHIFT_IDENTITY_TEST_SQL: $(IdentitySqlConnection)
- task: PublishTestResults@2
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/identity-results/**/*.trx'
    failTaskOnFailedTests: true
    failTaskOnMissingResultsFile: true
- pwsh: '& "${{ parameters.identityRoot }}/eng/Stop-IdentitySql.ps1" -Container "$(IdentitySqlContainer)"'
  condition: always()
  displayName: Remove owned identity SQL fixture
