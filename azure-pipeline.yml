trigger:
 tags:
    include:
    - release*
pr: none

pool:
  vmImage: ubuntu-22.04
  
variables:
- group: pipeline

steps:

 - checkout: self
   submodules: true
   persistCredentials: true

 # The mapper generator and framework analyzer reference Roslyn 5.9. Select the verified SDK
 # for every release group, including release-shiftmapper which does not run identity-checks.
 - task: UseDotNet@2
   displayName: 'Use verified framework build SDK'
   inputs:
    packageType: sdk
    # Review this pin during every framework-wide NuGet upgrade, especially Roslyn updates.
    # Change it when compiler/package requirements or SDK servicing warrant it, and verify
    # the affected builds/tests with the selected SDK before updating the pin.
    version: '10.0.401'

 - script: git clone https://github.com/ShiftSoftware/ShiftEntity.git ../ShiftEntity
   displayName: 'Clone ShiftEntity'

 - script: git clone https://github.com/ShiftSoftware/ShiftBlazor.git ../ShiftBlazor
   displayName: 'Clone Blazor'

 - script: git clone https://github.com/ShiftSoftware/ShiftFrameworkTestingTools.git ../ShiftFrameworkTestingTools
   displayName: 'Clone ShiftFrameworkTestingTools'

 - script: git clone https://github.com/ShiftSoftware/ShiftIdentity.git ../ShiftIdentity
   displayName: 'Clone ShiftIdentity'

 - script: git clone https://github.com/ShiftSoftware/TypeAuth.git ../TypeAuth
   displayName: 'Clone TypeAuth'

 - script: git clone https://github.com/ShiftSoftware/AzureFunctionsAspNetCoreAuthorization.git ../AzureFunctionsAspNetCoreAuthorization
   displayName: 'Clone AzureFunctionsAspNetCoreAuthorization'

 - script: git clone https://github.com/ShiftSoftware/ShiftFrameworkLocalization ../ShiftFrameworkLocalization
   displayName: 'Clone ShiftFrameworkLocalization'

 # Cloned anonymously like every other sibling, so the repository has to be public before a release* tag is built.
 # The clone is unconditional because StockPlusPlus.Data references ShiftMapper as a project: without the checkout,
 # the sample build (identity-checks) would need the ShiftSoftware.ShiftMapper package instead, and that package
 # is only ever published from this pipeline.
 - script: git clone https://github.com/ShiftSoftware/ShiftMapper.git ../ShiftMapper || { echo "##vso[task.logissue type=error]Could not clone https://github.com/ShiftSoftware/ShiftMapper anonymously. The repository must be readable without credentials (public), like every other sibling this pipeline clones, before any release* tag is built."; exit 1; }
   displayName: 'Clone ShiftMapper'

 # The identity checks guard the framework packages, so only the tags that publish them run them. release-typeauth,
 # release-aspNetCore-authorization and release-shiftmapper never see these steps; each of those groups has its own tests
 # below. Decided at template-expansion time, so the steps do not appear as skipped. The template's fast tier runs on
 # every such tag; its long-running tier (the SQL container, the SQL-backed identity tests and the consumer contract)
 # only when the tag name contains "with-long-running-tests".
 - ${{ if or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')) }}:
   - template: .pipelines/identity-checks.steps.yml
     parameters:
      identityRoot: $(Build.SourcesDirectory)/../ShiftIdentity
      templatesRoot: $(Build.SourcesDirectory)
      longRunning: ${{ contains(variables['Build.SourceBranch'], 'with-long-running-tests') }}

 - script: dotnet build ShiftTemplates.sln --configuration release
   displayName: 'Build template tooling'

 - script: dotnet pack ../ShiftFrameworkLocalization/ShiftSoftwareLocalization --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftSoftwareLocalization'

 - script: dotnet pack ../ShiftFrameworkTestingTools/ShiftFrameworkTestingTools --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftFrameworkTestingTools'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.AspNetCore --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.AspNetCore'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.AzureFunctions --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.AzureFunctions'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.Data --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.Data'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.Blazor --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.Blazor'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.Core --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.Core'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.Dashboard.AspNetCore --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.Dashboard.AspNetCore'

 - script: dotnet pack ../ShiftIdentity/ShiftIdentity.Dashboard.Blazor --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftIdentity.Dashboard.Blazor'

 # The ShiftEntity package (PackageId ShiftSoftware.ShiftEntity, packed from ShiftEntity.Core) carries the SHENT001
 # analyzer under analyzers/dotnet/cs — where the retired ShiftEntity.SourceGenerator used to be — through a None item
 # whose path is the analyzer project's build output. A wrong path there packs silently without it, so the package is
 # inspected right after it is built. Repository mapping itself is ShiftMapper's (the framework packages depend on
 # ShiftSoftware.ShiftMapper at ShiftMapperVersion), which is why the first framework release after a ShiftMapper bump
 # must be release-all, or release-shiftmapper first: a release-framework alone would reference a package version that
 # is not on nuget.org yet.
 - script: dotnet pack ../ShiftEntity/ShiftEntity.Core --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.Core'

 - script: |
    set -euo pipefail
    package=$(ls $(Build.ArtifactStagingDirectory)/Framework/ShiftSoftware.ShiftEntity.[0-9]*.nupkg)
    echo "Inspecting $package"
    contents=$(unzip -Z1 "$package")
    echo "$contents"
    grep -qx "analyzers/dotnet/cs/ShiftSoftware.ShiftEntity.Analyzers.dll" <<< "$contents" || { echo "##vso[task.logissue type=error]$package is missing analyzers/dotnet/cs/ShiftSoftware.ShiftEntity.Analyzers.dll — SHENT001 would not reach consumers. Check the None item in ShiftEntity.Core.csproj that packs the analyzer's build output."; exit 1; }
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'Verify the ShiftEntity package carries the analyzer'

 - script: dotnet pack ../ShiftEntity/ShiftEntity.CosmosDbReplication --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.CosmosDbReplication'

 - script: dotnet pack ../ShiftEntity/ShiftEntity.EFCore --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.EFCore'

 - script: dotnet pack ../ShiftEntity/ShiftEntity.Model --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.Model'

 - script: dotnet pack ../ShiftEntity/ShiftEntity.Web --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.Web'

 - script: dotnet pack ../ShiftEntity/ShiftEntity.Print --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.Print'

 - script: dotnet pack ../ShiftEntity/ShiftEntity.Functions --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftEntity.Functions'

 - script: dotnet pack ../ShiftBlazor/ShiftBlazor --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftBlazor'

 - script: dotnet pack ShiftTemplates.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/Framework
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   displayName: 'pack ShiftTemplates'

 - script: dotnet test ../TypeAuth/TypeAuth.Core.Tests
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-typeauth')))
   displayName: 'Test TypeAuth.Core'

 - script: dotnet test ../TypeAuth/TypeAuth.AspNetCore.Tests
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-typeauth')))
   displayName: 'Test TypeAuth.AspNetCore'

 - script: dotnet pack ../TypeAuth/TypeAuth.Core --configuration Release --output $(Build.ArtifactStagingDirectory)/TypeAuth
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-typeauth')))
   displayName: 'pack TypeAuth.Core'

 - script: dotnet pack ../TypeAuth/TypeAuth.Blazor --configuration Release --output $(Build.ArtifactStagingDirectory)/TypeAuth
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-typeauth')))
   displayName: 'pack TypeAuth.Blazor'

 - script: dotnet pack ../TypeAuth/TypeAuth.AspNetCore --configuration Release --output $(Build.ArtifactStagingDirectory)/TypeAuth
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-typeauth')))
   displayName: 'pack TypeAuth.AspNetCore'

 # - task: FuncToolsInstaller@0
 #   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-aspNetCore-authorization'))
 #   inputs:
 #    version: 'latest'

 # - script: dotnet test ../AzureFunctionsAspNetCoreAuthorization/Tests
 #   condition: or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-aspNetCore-authorization'))
 #   displayName: 'Test Azure Functions AspNetCore Authorization'

 - script: dotnet pack ../AzureFunctionsAspNetCoreAuthorization/ShiftSoftware.Azure.Functions.AspNetCore.Authorization --configuration Release --output $(Build.ArtifactStagingDirectory)/AzureFunctionsAspNetCoreAuthorization
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-aspNetCore-authorization')))
   displayName: 'pack Azure Functions AspNetCore Authorization'

 # ShiftMapper is versioned on its own (ShiftMapperVersion in ShiftFrameworkGlobalSettings.props) and published
 # by 'release-all' or its own 'release-shiftmapper' tag. One package carries both the runtime library and the
 # source generator, so the pack is followed by a check that both halves made it into the .nupkg.
 - script: dotnet test ../ShiftMapper/ShiftMapper.Tests --configuration Release
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-shiftmapper')))
   displayName: 'Test ShiftMapper'

 # Every generator test compiles a snippet with Roslyn; the 484 of them take well over the pipeline budget on a hosted
 # agent, so they run here only for a tag whose name contains "with-long-running-tests". ShiftMapper's own GitHub
 # workflow still runs them on every push.
 - script: dotnet test ../ShiftMapper/ShiftMapper.Generator.Tests --configuration Release
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-shiftmapper')), contains(variables['Build.SourceBranch'], 'with-long-running-tests'))
   displayName: 'Test ShiftMapper.Generator'

 - script: dotnet pack ../ShiftMapper/ShiftMapper --configuration Release --output $(Build.ArtifactStagingDirectory)/ShiftMapper
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-shiftmapper')))
   displayName: 'pack ShiftMapper'

 - script: |
    set -euo pipefail
    package=$(ls $(Build.ArtifactStagingDirectory)/ShiftMapper/*.nupkg)
    echo "Inspecting $package"
    contents=$(unzip -Z1 "$package")
    echo "$contents"
    for required in analyzers/dotnet/cs/ShiftMapper.Generator.dll analyzers/dotnet/cs/ShiftMapper.CodeFixes.dll lib/net10.0/ShiftMapper.dll lib/net10.0/ShiftMapper.xml README.md icon.png
    do
      grep -qx "$required" <<< "$contents" || { echo "##vso[task.logissue type=error]$package is missing $required"; exit 1; }
    done
    ls $(Build.ArtifactStagingDirectory)/ShiftMapper/*.snupkg > /dev/null || { echo "##vso[task.logissue type=error]No .snupkg symbol package was produced next to $package"; exit 1; }
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-shiftmapper')))
   displayName: 'Verify the ShiftMapper package carries the library and the generator'

 - task: NuGetToolInstaller@1
   inputs:
    versionSpec: '6.9.1'

 - task: NuGetCommand@2
   displayName: 'Push TypeAuth Packages' 
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-typeauth')))
   inputs:
    command: 'custom'
    arguments: 'push "$(Build.ArtifactStagingDirectory)/TypeAuth/**/*.nupkg" -Source https://api.nuget.org/v3/index.json -ApiKey $(ShiftSoftwareNugetApiKey)'

 - task: NuGetCommand@2
   displayName: 'Push Azure Functions AspNetCore Authorization' 
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-aspNetCore-authorization')))
   inputs:
    command: 'custom'
    arguments: 'push "$(Build.ArtifactStagingDirectory)/AzureFunctionsAspNetCoreAuthorization/**/*.nupkg" -Source https://api.nuget.org/v3/index.json -ApiKey $(ShiftSoftwareNugetApiKey) -SkipDuplicate'

 - task: NuGetCommand@2
   displayName: 'Push ShiftMapper Package'
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-shiftmapper')))
   inputs:
    command: 'custom'
    arguments: 'push "$(Build.ArtifactStagingDirectory)/ShiftMapper/**/*.nupkg" -Source https://api.nuget.org/v3/index.json -ApiKey $(ShiftSoftwareNugetApiKey) -SkipDuplicate'

 - task: NuGetCommand@2
   displayName: 'Push Framework Packages'
   condition: and(succeeded(), or(contains(variables['Build.SourceBranch'], 'refs/tags/release-all'), contains(variables['Build.SourceBranch'], 'refs/tags/release-framework')))
   inputs:
    command: 'custom'
    arguments: 'push "$(Build.ArtifactStagingDirectory)/Framework/**/*.nupkg" -Source https://api.nuget.org/v3/index.json -ApiKey $(ShiftSoftwareNugetApiKey)'
